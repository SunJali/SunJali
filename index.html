<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>门店价签绑定率看板</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #627080;
      --line: #e5eaf0;
      --surface: #ffffff;
      --canvas: #f5f7fa;
      --blue: #2067d8;
      --blue-soft: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .shell { max-width: 1640px; padding: 28px; margin: 0 auto; }
    .topbar { margin-bottom: 22px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.4px; }
    .subtitle { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin: 0 0 22px; }
    .metric { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.02); }
    .metric-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric-value { font-size: 24px; font-weight: 720; font-variant-numeric: tabular-nums; }
    .metric-note { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .metric.selected { border-color: #8bb5f4; background: #f7fbff; }
    .metric.selected .metric-value { color: #185cc3; }
    .metric-switch { display: flex; align-items: stretch; flex-wrap: wrap; gap: 9px; margin: 0 0 12px; }
    .metric-switch-label { display: flex; align-items: center; color: var(--muted); font-size: 13px; font-weight: 620; margin-right: 3px; }
    .metric-switch-btn { min-width: 176px; padding: 11px 14px; border: 1px solid #d6dde6; border-radius: 10px; background: #fff; color: #47586b; cursor: pointer; text-align: left; font: inherit; }
    .metric-switch-btn strong { display: block; font-size: 14px; }
    .metric-switch-btn small { display: block; margin-top: 3px; color: #718096; font-size: 11px; }
    .metric-switch-btn:hover, .metric-switch-btn.active { border-color: #5493ed; background: var(--blue-soft); color: #185cc3; box-shadow: 0 1px 3px rgba(32,103,216,.10); }
    .metric-switch-btn.active small { color: #3d6fae; }
    .filter-panel { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 13px 15px; margin: 0 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .filter-label { margin-right: 4px; color: var(--muted); font-size: 13px; font-weight: 620; }
    .filter-btn { padding: 7px 11px; border: 1px solid #d6dde6; border-radius: 99px; background: #fff; color: #47586b; cursor: pointer; font: inherit; font-size: 13px; line-height: 1.2; white-space: nowrap; }
    .filter-btn:hover, .filter-btn.active { border-color: #8bb5f4; background: var(--blue-soft); color: #185cc3; font-weight: 650; }
    .interest-filters { display: none; align-items: center; flex-wrap: wrap; gap: 7px; width: 100%; padding-top: 9px; margin-top: 1px; border-top: 1px dashed #dbe2eb; }
    .interest-filters.visible { display: flex; }
    .time-days { display: none; align-items: center; flex-wrap: wrap; gap: 7px; width: 100%; padding-top: 9px; margin-top: 1px; border-top: 1px dashed #dbe2eb; }
    .time-days.visible { display: flex; }
    .time-note { color: var(--muted); font-size: 12px; }
    .legend { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 14px; align-items: center; padding: 0 3px 10px; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 3px; border: 1px solid rgba(0,0,0,.06); }
    .table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; box-shadow: 0 2px 5px rgba(16,24,40,.025); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 760px; }
    table.compare-mode { min-width: 1260px; table-layout: fixed; }
    th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    thead th { position: sticky; top: 0; z-index: 3; padding: 12px; background: #f9fafb; text-align: center; font-size: 13px; font-weight: 650; line-height: 1.35; }
    table.compare-mode thead tr:nth-child(2) th { top: 67px; z-index: 4; }
    thead th:first-child { position: sticky; left: 0; z-index: 5; text-align: left; min-width: 160px; }
    tbody th { position: sticky; left: 0; z-index: 2; min-width: 160px; padding: 10px 14px; background: #fff; text-align: left; font-size: 13px; font-weight: 540; white-space: nowrap; }
    td { height: 56px; padding: 7px; text-align: center; background: #fff; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    .rate { width: 100%; height: 40px; border: 1px solid var(--rate-border); border-radius: 8px; background: var(--rate-bg); color: var(--rate-ink); cursor: pointer; font-size: 14px; font-weight: 720; font-variant-numeric: tabular-nums; transition: transform .12s, box-shadow .12s; }
    .rate:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(22,48,38,.18); }
    .rate:focus-visible { outline: 3px solid rgba(32,103,216,.35); outline-offset: 1px; }
    .blank { color: #a5afba; font-size: 13px; }
    .store-name { display: block; min-height: 28px; }
    .metric-head { padding: 7px 5px !important; color: var(--muted); font-size: 11px !important; font-weight: 540 !important; }
    .sort-actions { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
    .sort-btn { padding: 3px 6px; border: 1px solid #d6dde6; border-radius: 5px; background: #fff; color: #526273; cursor: pointer; font-size: 11px; line-height: 1.2; white-space: nowrap; }
    .sort-btn:hover, .sort-btn.active { border-color: #8bb5f4; background: #eaf2ff; color: #185cc3; }
    dialog { width: min(600px, calc(100vw - 28px)); border: 0; border-radius: 16px; padding: 0; color: var(--ink); box-shadow: 0 20px 60px rgba(17,30,45,.26); }
    dialog::backdrop { background: rgba(21,32,46,.48); backdrop-filter: blur(2px); }
    .modal-head { display: flex; justify-content: space-between; gap: 16px; padding: 20px 22px 17px; border-bottom: 1px solid var(--line); }
    .modal-kicker { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .modal-title { margin: 0; font-size: 18px; }
    .close { width: 30px; height: 30px; border: 0; border-radius: 7px; background: #f0f3f6; color: #4f5e6c; cursor: pointer; font-size: 20px; line-height: 1; }
    .modal-body { padding: 20px 22px 22px; }
    .modal-averages { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .modal-average { padding: 15px 16px; border-radius: 10px; background: var(--blue-soft); }
    .modal-average span { display: block; color: #4d6690; font-size: 13px; margin-bottom: 6px; }
    .modal-average strong { color: #185cc3; font-size: 25px; font-variant-numeric: tabular-nums; }
    .detail-title { margin: 22px 0 8px; font-size: 13px; color: var(--muted); }
    .detail-table { width: 100%; min-width: 0; border-collapse: collapse; }
    .detail-table th, .detail-table td { position: static; min-width: 0; height: auto; padding: 9px 7px; background: transparent; text-align: right; font-size: 12px; }
    .detail-table th:first-child, .detail-table td:first-child { text-align: left; }
    .detail-table th { color: var(--muted); font-weight: 500; }
    .legend.is-hidden { display: none; }
    @media (max-width: 680px) { .shell { padding: 16px; } .topbar { align-items: flex-start; flex-direction: column; gap: 8px; } .summary { grid-template-columns: 1fr; gap: 9px; } .metric-switch { display: grid; grid-template-columns: 1fr 1fr; } .metric-switch-label { grid-column: 1 / -1; } .metric-switch-btn { min-width: 0; } .legend { justify-content: flex-start; } .time-grid { gap: 7px; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><h1>门店价签绑定率看板</h1><p class="subtitle">按门店与品类汇总各采集时点的平均绑定率与平均陈列满足率；点击数值展开明细。</p></div>
    </div>
    <section class="summary" aria-label="总体概览">
      <article class="metric selected" id="bindingSummary"><span class="metric-label">整体平均绑定率</span><strong class="metric-value" id="overallRate">--</strong></article>
      <article class="metric" id="displaySummary"><span class="metric-label">整体平均陈列满足率</span><strong class="metric-value" id="overallDisplayRate">--</strong></article>
      <article class="metric"><span class="metric-label">门店数量</span><strong class="metric-value" id="storeCount">--</strong><span class="metric-note">家</span></article>
      <article class="metric"><span class="metric-label">品类数量</span><strong class="metric-value" id="categoryCount">--</strong><span class="metric-note">个</span></article>
    </section>
    <section class="metric-switch" aria-label="指标切换">
      <span class="metric-switch-label">主表查看</span>
      <button class="metric-switch-btn" data-metric="binding"><strong>电子价签绑定率</strong><small>低于 85% 红色突出；85% 及以上正常显示</small></button>
      <button class="metric-switch-btn" data-metric="display"><strong>陈列满足率</strong><small>低于 100% 黄色提示；100% 及以上正常显示</small></button>
      <button class="metric-switch-btn active" data-metric="compare"><strong>同时查看</strong><small>按门店并列查看绑定率与陈列满足率</small></button>
    </section>
    <section class="filter-panel" aria-label="时间筛选" id="timePanel">
      <span class="filter-label">时间筛选</span>
      <button class="filter-btn" data-time-mode="day">日</button>
      <button class="filter-btn active" data-time-mode="week">周度</button>
      <span class="time-note" id="timeNote"></span>
      <div class="time-days" id="timeDays" aria-label="按日筛选"></div>
    </section>
    <section class="filter-panel" aria-label="品类筛选" id="categoryPanel">
      <span class="filter-label">品类筛选</span>
      <button class="filter-btn active" data-filter="all">全部</button>
      <button class="filter-btn" data-filter="phone" title="手机-苹果机型、手机-安卓机型">手机</button>
      <button class="filter-btn" data-filter="core" title="笔记本、平板电脑、智能手表、耳机/耳麦、相机机身、相机镜头">5品类</button>
      <button class="filter-btn" data-filter="interest">兴趣品类</button>
      <button class="filter-btn" data-filter="electronic">兴趣-电子</button>
      <div class="interest-filters" id="interestFilters" aria-label="兴趣品类细分">
        <span class="filter-label">细分</span>
        <button class="filter-btn active" data-interest-filter="all">全部兴趣</button>
        <button class="filter-btn" data-interest-filter="toy" title="吊卡、手办、盲盒、大娃、潮玩周边">潮玩</button>
        <button class="filter-btn" data-interest-filter="instrument" title="自动挡吉他、民谣吉他、尤克里里">乐器</button>
        <button class="filter-btn" data-interest-filter="racket" title="羽毛球拍、乒乓球拍、网球拍">球拍</button>
      </div>
    </section>
    <div class="legend" id="bindingLegend" aria-label="绑定率颜色说明">
      <span>绑定率：</span><span class="legend-item"><i class="legend-swatch" style="background:#fecaca"></i>&lt;85% 待关注</span><span class="legend-item"><i class="legend-swatch" style="background:#ffffff"></i>≥85% 正常</span>
    </div>
    <div class="legend is-hidden" id="displayLegend" aria-label="陈列满足率颜色说明">
      <span>陈列满足率：</span><span class="legend-item"><i class="legend-swatch" style="background:#fde68a"></i>&lt;100% 未满足</span><span class="legend-item"><i class="legend-swatch" style="background:#ffffff"></i>≥100% 正常</span>
    </div>
    <section class="table-card" aria-label="门店品类绑定率矩阵"><table id="matrix"></table></section>
  </main>
  <dialog id="detailDialog">
    <div class="modal-head"><div><div class="modal-kicker" id="modalStore"></div><h2 class="modal-title" id="modalCategory"></h2></div><button class="close" id="closeModal" aria-label="关闭">×</button></div>
    <div class="modal-body"><div class="modal-averages"><div class="modal-average"><span>平均绑定率</span><strong id="modalBindingAverage"></strong></div><div class="modal-average"><span>平均陈列满足率</span><strong id="modalDisplayAverage"></strong></div></div><div class="detail-title" id="detailTitle">各采集时点明细</div><table class="detail-table" id="detailTable"></table></div>
  </dialog>

          const bindingRate = selectedRate(cell, 'bindingRate');
          const displayRate = selectedRate(cell, 'displayRate');
          const binding = bindingRate == null ? '<td><span class="blank">—</span></td>' : `<td><button class="rate" title="绑定率：${percentage(bindingRate)}" style="${bindingStyle(bindingRate)}" data-store="${encodeURIComponent(store.name)}" data-category="${encodeURIComponent(category)}">${percentage(bindingRate)}</button></td>`;
          const display = displayRate == null ? '<td><span class="blank">—</span></td>' : `<td><button class="rate" title="陈列满足率：${percentage(displayRate)}" style="${displayStyle(displayRate)}" data-store="${encodeURIComponent(store.name)}" data-category="${encodeURIComponent(category)}">${percentage(displayRate)}</button></td>`;
          return binding + display;
        }
        const rate = selectedRate(cell, metric.field);
        if (rate == null) return '<td><span class="blank">—</span></td>';
        return `<td><button class="rate" title="${metric.label}：${percentage(rate)}" style="${metric.style(rate)}" data-store="${encodeURIComponent(store.name)}" data-category="${encodeURIComponent(category)}">${percentage(rate)}</button></td>`;
      }).join('')}</tr>`).join('');
      table.innerHTML = colgroup + header + `<tbody>${rows}</tbody>`;
      table.classList.toggle('compare-mode', compareMode);
    }
    function sortedCategories(categories, store, order) {
      const multiplier = order === 'asc' ? 1 : -1;
      return [...categories].sort((a, b) => {
        const sortField = activeMetric === 'display' ? 'displayRate' : 'bindingRate';
        const aCell = getCell(store, a);
        const bCell = getCell(store, b);
        const aRate = aCell ? selectedRate(aCell, sortField) : null;
        const bRate = bCell ? selectedRate(bCell, sortField) : null;
        if (aRate == null && bRate == null) return 0;
        if (aRate == null) return 1;
        if (bRate == null) return -1;
        return (aRate - bRate) * multiplier;
      });
    }
    function refreshView() {
      const categories = filteredCategories();
      renderTimeControls();
      updateSummary(categories);
      renderTable(activeSort ? sortedCategories(categories, activeSort.store, activeSort.order) : categories);
      document.querySelectorAll('[data-filter]').forEach(button => button.classList.toggle('active', button.dataset.filter === activeFilter));
      document.querySelectorAll('[data-interest-filter]').forEach(button => button.classList.toggle('active', button.dataset.interestFilter === activeInterestFilter));
      document.querySelectorAll('[data-metric]').forEach(button => button.classList.toggle('active', button.dataset.metric === activeMetric));
      document.getElementById('interestFilters').classList.toggle('visible', activeFilter === 'interest');
      document.getElementById('bindingLegend').classList.toggle('is-hidden', activeMetric === 'display');
      document.getElementById('displayLegend').classList.toggle('is-hidden', activeMetric === 'binding');
    }
    refreshView();

    const dialog = document.getElementById('detailDialog');
    function showDetail(store, category) {
      const cell = getCell(store, category);
      const snapshots = selectedSnapshots(cell);
      document.getElementById('modalStore').textContent = store;
      document.getElementById('modalCategory').textContent = category;
      document.getElementById('modalBindingAverage').textContent = percentage(selectedRate(cell, 'bindingRate'));
      document.getElementById('modalDisplayAverage').textContent = percentage(selectedRate(cell, 'displayRate'));
      document.getElementById('detailTitle').textContent = `各采集时点明细 · ${currentPeriodLabel()}`;
      document.getElementById('detailTable').innerHTML = `<thead><tr><th>采集时间</th><th>绑定率</th><th>陈列满足率</th><th>绑定价签</th><th>目标库存</th><th>在店库存</th></tr></thead><tbody>${snapshots.map(item => `<tr><td>${item.label}</td><td>${percentage(item.bindingRate)}</td><td>${percentage(item.displayRate)}</td><td>${item.boundCount.toLocaleString('zh-CN')}</td><td>${item.targetStock.toLocaleString('zh-CN')}</td><td>${item.storeStock.toLocaleString('zh-CN')}</td></tr>`).join('')}</tbody>`;
      dialog.showModal();
    }
    table.addEventListener('click', event => {
      const sortButton = event.target.closest('.sort-btn');
      if (sortButton) {
        const store = decodeURIComponent(sortButton.dataset.sortStore);
        const order = sortButton.dataset.order;
        activeSort = activeSort?.store === store && activeSort?.order === order ? null : {store, order};
        refreshView();
        return;
      }
      const button = event.target.closest('.rate');
      if (button) showDetail(decodeURIComponent(button.dataset.store), decodeURIComponent(button.dataset.category));
    });
    document.getElementById('categoryPanel').addEventListener('click', event => {
      const filterButton = event.target.closest('[data-filter]');
      if (filterButton) {
        activeFilter = filterButton.dataset.filter;
        refreshView();
        return;
      }
      const interestButton = event.target.closest('[data-interest-filter]');
      if (interestButton) {
        activeInterestFilter = interestButton.dataset.interestFilter;
        refreshView();
      }
    });
    document.querySelector('.metric-switch').addEventListener('click', event => {
      const metricButton = event.target.closest('[data-metric]');
      if (!metricButton) return;
      activeMetric = metricButton.dataset.metric;
      activeSort = null;
      refreshView();
    });
    document.getElementById('timePanel').addEventListener('click', event => {
      const timeModeButton = event.target.closest('[data-time-mode]');
      if (timeModeButton) {
        activeTimeMode = timeModeButton.dataset.timeMode;
        activeSort = null;
        refreshView();
        return;
      }
      const dayButton = event.target.closest('[data-day]');
      if (dayButton) {
        activeDay = dayButton.dataset.day;
        refreshView();
      }
    });
    document.getElementById('closeModal').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
