<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>门店价签绑定率看板</title>
  <style>
    :root {
      --ink: #17212b;
      --muted: #627080;
      --line: #e5eaf0;
      --surface: #ffffff;
      --canvas: #f5f7fa;
      --blue: #2067d8;
      --blue-soft: #eaf2ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .shell { max-width: 1640px; padding: 28px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; gap: 24px; align-items: flex-end; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.4px; }
    .subtitle { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
    .updated { flex: 0 0 auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0 0 22px; }
    .metric { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.02); }
    .metric-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .metric-value { font-size: 24px; font-weight: 720; font-variant-numeric: tabular-nums; }
    .metric-note { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
    .legend { display: flex; justify-content: flex-end; gap: 12px; align-items: center; padding: 0 3px 10px; color: var(--muted); font-size: 12px; }
    .legend-scale { height: 9px; width: 142px; border-radius: 99px; background: linear-gradient(90deg, #fbe5e6, #fbdcaa, #d8efc5, #bce4d0, #83c8b1); }
    .table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; box-shadow: 0 2px 5px rgba(16,24,40,.025); }
    table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 960px; }
    th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    thead th { position: sticky; top: 0; z-index: 3; padding: 12px; background: #f9fafb; text-align: center; font-size: 13px; font-weight: 650; line-height: 1.35; }
    thead th:first-child { position: sticky; left: 0; z-index: 5; text-align: left; min-width: 160px; }
    tbody th { position: sticky; left: 0; z-index: 2; min-width: 160px; padding: 10px 14px; background: #fff; text-align: left; font-size: 13px; font-weight: 540; white-space: nowrap; }
    td { height: 56px; padding: 7px; text-align: center; background: #fff; }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    .rate { width: 100%; height: 40px; border: 0; border-radius: 8px; background: var(--rate-bg); color: #173126; cursor: pointer; font-size: 14px; font-weight: 720; font-variant-numeric: tabular-nums; transition: transform .12s, box-shadow .12s; }
    .rate:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(22,48,38,.18); }
    .rate:focus-visible { outline: 3px solid rgba(32,103,216,.35); outline-offset: 1px; }
    .blank { color: #a5afba; font-size: 13px; }
    .store-name { display: block; min-height: 36px; }
    .sort-actions { display: flex; justify-content: center; gap: 5px; margin-top: 8px; }
    .sort-btn { padding: 3px 6px; border: 1px solid #d6dde6; border-radius: 5px; background: #fff; color: #526273; cursor: pointer; font-size: 11px; line-height: 1.2; white-space: nowrap; }
    .sort-btn:hover, .sort-btn.active { border-color: #8bb5f4; background: #eaf2ff; color: #185cc3; }
    dialog { width: min(600px, calc(100vw - 28px)); border: 0; border-radius: 16px; padding: 0; color: var(--ink); box-shadow: 0 20px 60px rgba(17,30,45,.26); }
    dialog::backdrop { background: rgba(21,32,46,.48); backdrop-filter: blur(2px); }
    .modal-head { display: flex; justify-content: space-between; gap: 16px; padding: 20px 22px 17px; border-bottom: 1px solid var(--line); }
    .modal-kicker { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .modal-title { margin: 0; font-size: 18px; }
    .close { width: 30px; height: 30px; border: 0; border-radius: 7px; background: #f0f3f6; color: #4f5e6c; cursor: pointer; font-size: 20px; line-height: 1; }
    .modal-body { padding: 20px 22px 22px; }
    .modal-average { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 16px; margin-bottom: 16px; border-radius: 10px; background: var(--blue-soft); }
    .modal-average span { color: #4d6690; font-size: 13px; }
    .modal-average strong { color: #185cc3; font-size: 26px; font-variant-numeric: tabular-nums; }
    .time-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .time-card { padding: 13px; border: 1px solid var(--line); border-radius: 10px; }
    .time-card span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 12px; }
    .time-card strong { font-size: 19px; font-variant-numeric: tabular-nums; }
    .detail-title { margin: 22px 0 8px; font-size: 13px; color: var(--muted); }
    .detail-table { width: 100%; min-width: 0; border-collapse: collapse; }
    .detail-table th, .detail-table td { position: static; min-width: 0; height: auto; padding: 9px 7px; background: transparent; text-align: right; font-size: 12px; }
    .detail-table th:first-child, .detail-table td:first-child { text-align: left; }
    .detail-table th { color: var(--muted); font-weight: 500; }
    @media (max-width: 680px) { .shell { padding: 16px; } .topbar { align-items: flex-start; flex-direction: column; gap: 8px; } .summary { grid-template-columns: 1fr; gap: 9px; } .legend { justify-content: flex-start; } .time-grid { gap: 7px; } }
  </style>
</head>

    const points = data.timePoints;
    const percentage = value => `${(value * 100).toFixed(1)}%`;

    const colorFor = value => {
      const bounded = Math.max(0, Math.min(value, 1));
      const hue = 2 + bounded * 150;
      const saturation = 66 - bounded * 10;
      const lightness = 94 - bounded * 22;
      return `hsl(${hue} ${saturation}% ${lightness}%)`;
    };
    const allCells = Object.values(data.matrix);
    document.getElementById('overallRate').textContent = percentage(allCells.reduce((sum, cell) => sum + cell.avg, 0) / allCells.length);
    document.getElementById('storeCount').textContent = data.stores.length;
    document.getElementById('categoryCount').textContent = data.categories.length;
    document.getElementById('updated').textContent = `数据共 ${data.recordCount} 条 · 生成于 ${data.generatedAt}`;

    const table = document.getElementById('matrix');
    let activeSort = null;
    function renderTable(categories) {
      const header = `<thead><tr><th scope="col">品类 ↓ ／ 门店 →</th>${data.stores.map(store => `<th scope="col" title="${store.name}"><span class="store-name">${store.shortName}</span><span class="sort-actions"><button class="sort-btn ${activeSort?.store === store.name && activeSort.order === 'asc' ? 'active' : ''}" data-sort-store="${encodeURIComponent(store.name)}" data-order="asc">↑ 升序</button><button class="sort-btn ${activeSort?.store === store.name && activeSort.order === 'desc' ? 'active' : ''}" data-sort-store="${encodeURIComponent(store.name)}" data-order="desc">↓ 降序</button></span></th>`).join('')}</tr></thead>`;
      const rows = categories.map(category => `<tr><th scope="row">${category}</th>${data.stores.map(store => {
        const cell = getCell(store.name, category);
        return cell ? `<td><button class="rate" style="--rate-bg:${colorFor(cell.avg)}" data-store="${encodeURIComponent(store.name)}" data-category="${encodeURIComponent(category)}">${percentage(cell.avg)}</button></td>` : '<td><span class="blank">—</span></td>';
      }).join('')}</tr>`).join('');
      table.innerHTML = header + `<tbody>${rows}</tbody>`;
    }
    function sortedCategories(store, order) {
      const multiplier = order === 'asc' ? 1 : -1;
      return [...data.categories].sort((a, b) => {
        const aRate = getCell(store, a)?.avg;
        const bRate = getCell(store, b)?.avg;
        if (aRate == null && bRate == null) return 0;
        if (aRate == null) return 1;
        if (bRate == null) return -1;
        return (aRate - bRate) * multiplier;
      });
    }
    renderTable(data.categories);

    const dialog = document.getElementById('detailDialog');
    const esc = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function showDetail(store, category) {
      const cell = getCell(store, category);
      document.getElementById('modalStore').textContent = store;
      document.getElementById('modalCategory').textContent = category;
      document.getElementById('modalAverage').textContent = percentage(cell.avg);
      document.getElementById('timeGrid').innerHTML = points.map(point => `<div class="time-card"><span>${point}</span><strong>${percentage(cell.pointRates[point])}</strong></div>`).join('');
      const showDetailRows = cell.detail.length > 1;
      document.getElementById('detailTitle').textContent = showDetailRows ? '源数据细分（同品类多行按算术均值汇总）' : '源数据记录';
      document.getElementById('detailTable').innerHTML = `<thead><tr><th>细分</th><th>绑定价签</th><th>目标库存</th>${points.map(point => `<th>${point}</th>`).join('')}</tr></thead><tbody>${cell.detail.map(item => `<tr><td>${esc(item.subtype)}</td><td>${item.boundCount.toLocaleString('zh-CN')}</td><td>${item.targetStock.toLocaleString('zh-CN')}</td>${points.map(point => `<td>${percentage(item.times[point])}</td>`).join('')}</tr>`).join('')}</tbody>`;
      dialog.showModal();
    }
    table.addEventListener('click', event => {
      const sortButton = event.target.closest('.sort-btn');
      if (sortButton) {
        const store = decodeURIComponent(sortButton.dataset.sortStore);
        const order = sortButton.dataset.order;
        activeSort = activeSort?.store === store && activeSort?.order === order ? null : {store, order};
        renderTable(activeSort ? sortedCategories(activeSort.store, activeSort.order) : data.categories);
        return;
      }
      const button = event.target.closest('.rate');
      if (button) showDetail(decodeURIComponent(button.dataset.store), decodeURIComponent(button.dataset.category));
    });
    document.getElementById('closeModal').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  </script>
